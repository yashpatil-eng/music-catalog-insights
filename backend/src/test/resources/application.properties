# Test profile: in-memory H2, no external DB needed to run unit tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.jwt.secret=test-secret-key-for-unit-tests-only-not-for-production-use
app.jwt.expiration-ms=3600000
app.itunes.base-url=https://itunes.apple.com
app.ai.anthropic-api-key=
app.ai.anthropic-model=claude-sonnet-4-6
app.cors.allowed-origins=http://localhost:3000

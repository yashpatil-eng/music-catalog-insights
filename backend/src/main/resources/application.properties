spring.application.name=music-catalog-insights

# --- Database ---
# Default: local Postgres. Override via env vars in production (Render/Railway inject these).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/music_catalog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# 32+ char secret required for HS256. Override in production via env var.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- iTunes API ---
app.itunes.base-url=https://itunes.apple.com

# --- AI feature ---
# Optional. If unset, the AI insights endpoint falls back to rule-based summaries.
app.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic-model=claude-sonnet-4-6

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server.port=${PORT:8080}
logging.level.com.ledgerscfo=INFO
